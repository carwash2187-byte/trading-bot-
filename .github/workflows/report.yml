name: daily report

on:
  schedule:
    - cron: "17 23 * * *"     # once a day, after the session settles
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Write today's line
        env:
          TRADELOCKER_USERNAME: ${{ secrets.TRADELOCKER_USERNAME }}
          TRADELOCKER_PASSWORD: ${{ secrets.TRADELOCKER_PASSWORD }}
          TRADELOCKER_SERVER: ${{ secrets.TRADELOCKER_SERVER }}
          TRADELOCKER_ACCOUNT: ${{ secrets.TRADELOCKER_ACCOUNT }}
        run: python3 daily_report.py
