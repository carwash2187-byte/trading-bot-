name: trade

# Every 5 minutes, which is GitHub's floor -- it refuses anything shorter.
#
# Checking more often would not help even if it were allowed: the strategy
# reads 15-minute candles, so a new signal can only appear when a 15-minute bar
# closes. Five minutes already looks three times more often than the chart can
# change; a one-minute schedule would re-read the same unchanged bar fifteen
# times.
#
# This is only affordable on a PUBLIC repository, which gets unlimited Actions
# minutes. A private one allows 2,000 a month and this uses roughly 5,000, so
# it would stop partway through the month -- silently, which is the worst way
# for a trading bot to stop. Nothing secret lives in the repo: the broker
# password is a GitHub Secret, and .env is gitignored.
on:
  schedule:
    # Offset by three minutes rather than "*/5". A */5 schedule fires at :00,
    # :05, :10 -- the same instants every other GitHub user picks, and the most
    # contended slots on the platform. GitHub delays scheduled runs under load
    # and drops them outright at the extreme, so landing on the quarter-hour
    # marks is choosing the worst moment to ask.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Two runs at once could double an order. GitHub will queue rather than
# overlap, and cancel-in-progress is wrong here -- a half-finished run may
# already have placed an order.
concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      # The risk breakers keep their memory -- yesterday's peak, today's
      # starting equity, the halted flag -- in run/risk_state.json. Every
      # Actions run starts on a wiped filesystem, so without this restore the
      # breakers wake with amnesia each run and can never trip. Cache keys are
      # immutable, so each run saves under its own id and the next run
      # restores the newest one via the prefix.
      - name: Remember the risk state
        uses: actions/cache@v4
        with:
          path: run
          key: risk-state-${{ github.run_id }}
          restore-keys: |
            risk-state-

      # No setup-python step and no install step. The bot depends on nothing
      # outside the standard library, so the runner's own Python is enough --
      # which saves about fifteen seconds a run, and removes any chance of a
      # dependency breaking the schedule while nobody is watching.
      - name: Trade one cycle
        env:
          TRADELOCKER_USERNAME: ${{ secrets.TRADELOCKER_USERNAME }}
          TRADELOCKER_PASSWORD: ${{ secrets.TRADELOCKER_PASSWORD }}
          TRADELOCKER_SERVER: ${{ secrets.TRADELOCKER_SERVER }}
          TRADELOCKER_ACCOUNT: ${{ secrets.TRADELOCKER_ACCOUNT }}
          # The account's opening balance. Feeds a drawdown guard that needs
          # no stored state at all -- the firm ends the account 6% below this
          # number, so the fatal line is a constant. It backstops the cached
          # state above: a cache miss degrades the breakers, never this.
          TRADEBOT_START_BALANCE: "2635.39"
        run: |
          python3 run.py \
            --broker tradelocker --mode demo \
            --symbols XAUUSD --strategies gold_scalper \
            --risk-per-trade 0.015 \
            --daily-loss-limit 0.03 \
            --max-drawdown-limit 0.06 \
            --verbose
